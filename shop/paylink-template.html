<!doctype html>
<html lang="ta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Pay Link Maker – TNPSC Best Books</title>
<style>
:root{--ink:#141B33;--ink2:#545B70;--red:#C8374A;--wa:#16784A;--bg:#F6F4EF;--line:#E3DFD5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'Noto Sans Tamil','Nirmala UI',system-ui,sans-serif}
header{background:var(--ink);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:18px}
header p{margin:2px 0 0;font-size:12.5px;opacity:.8}
main{max-width:720px;margin:0 auto;padding:12px 16px 220px}
input[type=search]{width:100%;height:44px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font:inherit;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:6px}
.row .n{flex:1;font-size:13.5px;line-height:1.35}
.row .n b{display:block;font-size:13px;color:var(--ink2);font-weight:600}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:9px}
.qty button{width:38px;height:38px;border:none;background:none;font-size:18px;font-weight:700}
.qty span{min-width:22px;text-align:center;font-weight:700}
.row.on{border-color:var(--wa);background:#F1F8F4}
.out{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(20,27,51,.08);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.out .in{max-width:720px;margin:0 auto}
.tot{display:flex;justify-content:space-between;font-weight:800;font-size:16px;margin-bottom:6px}
textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 10px;font:inherit;font-size:13px;height:64px;resize:none}
.btns{display:flex;gap:8px;margin-top:8px}
.btns button,.btns a{flex:1;min-height:46px;border:none;border-radius:10px;font:inherit;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;text-decoration:none;color:#fff;cursor:pointer}
.copy{background:var(--ink)}.send{background:var(--wa)}.clear{background:#eee;color:var(--ink)!important;flex:0 0 70px!important}
.hint{font-size:12px;color:var(--ink2);margin:6px 0 0}
</style>
</head>
<body>
<header><h1>Pay Link Maker</h1><p>WhatsApp-ல் ஆர்டர் செய்தவருக்கு ஆன்லைன் பணம் செலுத்தும் இணைப்பு உருவாக்க / Make a payment link for a WhatsApp order</p></header>
<main>
<input type="search" id="q" placeholder="புத்தகம் தேடுக… / Search books" aria-label="Search books">
<div id="list"></div>
</main>
<div class="out"><div class="in">
<div class="tot"><span id="cnt">0 புத்தகம்</span><span id="tot">₹0</span></div>
<textarea id="msg" readonly aria-label="Message to send"></textarea>
<div class="btns"><button class="clear" type="button" id="clear">Clear</button><button class="copy" type="button" id="copy">Copy</button><a class="send" id="send" href="#" target="_blank" rel="noopener">WhatsApp</a></div>
<p class="hint">வாடிக்கையாளர் இணைப்பைத் திறந்தால் புத்தகங்கள் கார்ட்டில் இருக்கும் → UPI / Card மூலம் செலுத்தலாம். COD-யும் தேர்வு செய்யலாம்.</p>
</div></div>
<script>
(function(){
var P={{DATA}},SHOP='https://assoundararajan-lab.github.io/tnpsc-posts/shop/',c={};
var $=function(s){return document.getElementById(s)};
var K='TBB#2026srt';function fnv(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0}return ('00000'+h.toString(36)).slice(-6)}function xr(s){var o='';for(var i=0;i<s.length;i++)o+=String.fromCharCode(s.charCodeAt(i)^K.charCodeAt(i%K.length));return o}function enc(s){return fnv(s+K)+btoa(xr(s)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}function dec(t){try{var c=t.slice(0,6),b=t.slice(6).replace(/-/g,'+').replace(/_/g,'/');var s=xr(atob(b));return fnv(s+K)===c?s:null}catch(e){return null}}

function rs(v){return '₹'+v.toLocaleString('en-IN',{maximumFractionDigits:2})}
function esc(s){return s.replace(/[&<>"]/g,function(x){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[x]})}
function draw(){
  var q=$('q').value.trim().toLowerCase();
  $('list').innerHTML=P.filter(function(p){return !q||p.n.toLowerCase().indexOf(q)>-1}).map(function(p){var n=c[p.i]||0;
    return '<div class="row'+(n?' on':'')+'"><div class="n">'+esc(p.n)+'<b>'+rs(p.p)+'</b></div><div class="qty"><button type="button" data-i="'+p.i+'" data-d="-1" aria-label="less">−</button><span>'+n+'</span><button type="button" data-i="'+p.i+'" data-d="1" aria-label="more">+</button></div></div>'}).join('');
  var a=[],t=0,k=0,lines=[];for(var i in c){var p=P[i];a.push(p.id.slice(0,8)+'-'+c[i]);t+=p.p*c[i];k+=c[i];lines.push('• '+p.n+' × '+c[i])}
  $('cnt').textContent=k+' புத்தகம்';$('tot').textContent=rs(t);
  var m=k?('வணக்கம்! உங்கள் ஆர்டர்:\n'+lines.join('\n')+'\nமொத்தம்: '+rs(t)+'\n\nஇந்த இணைப்பில் UPI / Card மூலம் பணம் செலுத்துங்கள் (இலவச டெலிவரி):\n'+SHOP+'?o='+enc(a.join('.'))+'\n\n– TNPSC Best Books, Namakkal'):'';
  $('msg').value=m;$('send').href='https://wa.me/?text='+encodeURIComponent(m);
}
$('list').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var i=b.dataset.i;c[i]=(c[i]||0)+Number(b.dataset.d);if(c[i]<=0)delete c[i];draw()});
$('q').addEventListener('input',draw);
$('clear').onclick=function(){c={};draw()};
$('copy').onclick=function(){var m=$('msg').value;if(!m)return;(navigator.clipboard?navigator.clipboard.writeText(m):Promise.reject()).catch(function(){$('msg').select();document.execCommand('copy')});this.textContent='Copied ✓';var b=this;setTimeout(function(){b.textContent='Copy'},1500)};
draw();
})();
</script>
</body>
</html>
